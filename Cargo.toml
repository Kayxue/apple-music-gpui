[package]
name = "apple-music-gpui"
version = "0.1.0"
edition = "2024"

[dependencies]
gpui-kit = "0.9"
gpui-webview = "0.9"
wry = { version = "0.53.3", package = "lb-wry" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
rusqlite = { version = "0.32", features = ["bundled"] }
keyring = "3"
symphonia = { version = "0.5", features = ["aac", "alac", "isomp4", "mp3", "pcm", "wav"] }
cpal = "0.15"
ringbuf = "0.4"
biquad = "0.4"
rustfft = "6"
flume = "0.11"
tiny_http = "0.12"
jsonwebtoken = "9"


